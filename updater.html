<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>데이터 편집기 (Vue)</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0e1e1f;
            --panel: #13292a;
            --panel-2: #183536;
            --text: #f4f7f7;
            --muted: #a9c7c4;
            --accent: #eaa521;
            --accent-soft: #f5c96a;
            --border: #2d4f4f;
            --danger: #ffb4b4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Nanum Myeongjo", "Times New Roman", serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
        }

        .compact-card {
            max-width: 920px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 8px;
            color: var(--accent-soft);
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: var(--muted);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .input-row {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .text-input {
            flex: 1 1 260px;
            min-width: 200px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0b1718;
            color: #f7fbfa;
            padding: 10px 12px;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 0.9rem;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent);
            color: #111;
            font-weight: 700;
        }

        .btn-secondary {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .json-editor {
            width: 100%;
            min-height: 300px;
            max-height: 420px;
            resize: vertical;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #0b1718;
            color: #f7fbfa;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .json-editor.is-flash {
            animation: jsonFlash 1.1s ease;
            border-color: #eaa521;
            box-shadow: 0 0 0 3px rgba(234, 165, 33, 0.22);
        }

        @keyframes jsonFlash {
            0% {
                background: #1a2f31;
            }
            100% {
                background: #0b1718;
            }
        }

        .desc-editor {
            width: 100%;
            min-height: 72px;
            max-height: 140px;
            resize: vertical;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #2f4f52;
            background: #0b1718;
            color: #eef8f6;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.82rem;
            line-height: 1.35;
        }

        .hint {
            font-size: 0.95rem;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.6;
        }

        .tabs {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #102325;
            color: var(--text);
            padding: 8px 12px;
        }

        .tab-btn.is-active {
            background: var(--accent);
            color: #111;
            font-weight: 700;
            border-color: #d8a548;
        }

        .tab-panel {
            margin-top: 14px;
            border: 1px solid #264245;
            border-radius: 12px;
            background: #102527;
            padding: 14px;
        }

        .tab-panel-form {
            background: #0f2324;
            border: 1px solid #2b4b4d;
            color: #e7f1f0;
        }

        .fade-tab-enter-active,
        .fade-tab-leave-active {
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .fade-tab-enter-from,
        .fade-tab-leave-to {
            opacity: 0;
            transform: translateY(4px);
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-width: 760px;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        .form-label {
            flex: 0 0 84px;
            font-size: 0.82rem;
            color: #c6d8d6;
            font-weight: 700;
            line-height: 1;
            text-align: right;
        }

        .form-label::after {
            content: ":";
            margin-left: 4px;
        }

        .form-grid .text-input {
            min-width: 0;
            padding: 5px 8px;
            font-size: 0.82rem;
            line-height: 1.2;
            border-radius: 4px;
            min-height: 30px;
            border: 1px solid #2f4f52;
            background: #0b1718;
            color: #eef8f6;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            flex: 1 1 auto;
        }

        .form-grid .text-input::placeholder,
        .desc-editor::placeholder {
            color: #7f9492;
        }

        .form-grid .text-input:hover,
        .desc-editor:hover {
            border-color: #3e686b;
        }

        .form-grid .text-input:focus,
        .desc-editor:focus {
            outline: none;
            border-color: #63b7ba;
            box-shadow: 0 0 0 1px #63b7ba;
        }

        .form-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status {
            min-height: 22px;
            color: var(--accent-soft);
            font-size: 0.95rem;
            margin-top: 10px;
            line-height: 1.5;
        }

        .status.is-error {
            color: var(--danger);
        }

        .inline-code {
            display: inline-block;
            padding: 0.15rem 0.45rem;
            border-radius: 6px;
            background: rgba(234, 165, 33, 0.16);
            color: var(--accent-soft);
            font-family: monospace;
            font-size: 0.9rem;
        }

        @media (max-width: 720px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 14px;
            }

            .form-grid {
                max-width: none;
            }

            .form-row {
                align-items: flex-start;
            }

            .form-label {
                flex-basis: 72px;
                font-size: 0.76rem;
            }

            .json-editor {
                min-height: 240px;
                max-height: 320px;
            }
        }
    </style>
 </head>
<body>
    <div id="app" class="page">
        <section class="card">
            <h1>데이터 편집기 (Vue)</h1>
            <p>책 지도에 필요한 데이터를 입력하고 검증한 뒤 서버의 data.json으로 반영할 수 있습니다.</p>
            <div class="toolbar">
                <button type="button" class="btn-primary" @click="populateExample">예시 데이터 불러오기</button>
                <button type="button" class="btn-secondary" @click="loadCurrentJson">현재 data.json 불러오기</button>
                <button type="button" class="btn-secondary" @click="validateJson">JSON 검증</button>
                <button type="button" class="btn-primary" @click="applyChangesToServer" :disabled="isSubmitting">{{ isSubmitting ? "반영 중..." : "서버 반영" }}</button>
            </div>
            <div class="input-row">
                <input v-model="editorApiKey" class="text-input" type="password" placeholder="편집 인증키 입력 (Vercel EDITOR_API_KEY)" autocomplete="current-password" />
                <input v-model="commitMessage" class="text-input" type="text" placeholder="커밋 메시지 (선택)" />
            </div>
            <div class="status" :class="{ 'is-error': statusType === 'error' }">{{ statusMessage }}</div>
        </section>

        <section class="card compact-card">
            <div class="tabs">
                <button
                    type="button"
                    class="tab-btn"
                    :class="{ 'is-active': activeTab === 'json' }"
                    @click="activeTab = 'json'"
                >JSON 직접 편집</button>
                <button
                    type="button"
                    class="tab-btn"
                    :class="{ 'is-active': activeTab === 'item' }"
                    @click="activeTab = 'item'"
                >새 항목 추가</button>
            </div>

            <transition name="fade-tab" mode="out-in">
                <div :key="activeTab">
                    <div v-if="activeTab === 'json'" class="tab-panel">
                        <textarea ref="jsonEditorRef" class="json-editor" :class="{ 'is-flash': isJsonFlash }" v-model="editorValue" spellcheck="false"></textarea>
                        <div class="hint">
                            형식은
                            <span class="inline-code">[{ "id": "seoul-광장", "country": "대한민국", "city": "서울", "lat": 37.5665, "lng": 126.9780, "title": "광장", "author": "최인훈", "desc": "설명" }]</span>
                            형태로 입력하면 됩니다.
                        </div>
                    </div>

                    <div v-else class="tab-panel tab-panel-form">
                        <div class="form-grid">
                            <label class="form-row">
                                <span class="form-label">id (선택)</span>
                                <input v-model.trim="newItem.id" class="text-input" type="text" placeholder="예: Tokyo-마음" />
                            </label>
                            <label class="form-row">
                                <span class="form-label">country</span>
                                <input v-model.trim="newItem.country" class="text-input" type="text" placeholder="예: 일본" />
                            </label>
                            <label class="form-row">
                                <span class="form-label">city</span>
                                <input v-model.trim="newItem.city" class="text-input" type="text" placeholder="예: 도쿄" />
                            </label>
                            <label class="form-row">
                                <span class="form-label">lat</span>
                                <input v-model.trim="newItem.lat" class="text-input" type="text" placeholder="예: 35.6762" />
                            </label>
                            <label class="form-row">
                                <span class="form-label">lng</span>
                                <input v-model.trim="newItem.lng" class="text-input" type="text" placeholder="예: 139.6503" />
                            </label>
                            <label class="form-row">
                                <span class="form-label">title</span>
                                <input v-model.trim="newItem.title" class="text-input" type="text" placeholder="예: 작품 제목" />
                            </label>
                            <label class="form-row">
                                <span class="form-label">author</span>
                                <input v-model.trim="newItem.author" class="text-input" type="text" placeholder="예: 저자명" />
                            </label>
                            <label class="form-row">
                                <span class="form-label">desc</span>
                                <textarea class="desc-editor" v-model.trim="newItem.desc" spellcheck="false"></textarea>
                            </label>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-primary" @click="prependItemToJson">업데이트</button>
                            <button type="button" class="btn-secondary" @click="resetNewItemForm">필드 초기화</button>
                        </div>
                    </div>
                </div>
            </transition>

            <div class="hint">
                서버 반영은 Vercel API를 통해 GitHub 저장소의 data.json을 커밋하는 방식입니다.
            </div>
        </section>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
        const { createApp, ref, reactive, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const editorValue = ref("");
                const statusMessage = ref("빈 JSON 배열로 시작합니다.");
                const statusType = ref("info");
                const editorApiKey = ref("");
                const commitMessage = ref("");
                const isSubmitting = ref(false);
                const activeTab = ref("json");
                const jsonEditorRef = ref(null);
                const isJsonFlash = ref(false);
                const newItem = reactive({
                    id: "",
                    country: "",
                    city: "",
                    lat: "",
                    lng: "",
                    title: "",
                    author: "",
                    desc: ""
                });

                function setStatus(message, type = "info") {
                    statusMessage.value = message;
                    statusType.value = type;
                }

                function getDefaultJson() {
                    return `[
  {
    "id": "seoul-광장",
    "country": "대한민국",
    "city": "서울",
    "lat": 37.5665,
    "lng": 126.978,
    "title": "광장",
    "author": "최인훈",
    "desc": "서울을 배경으로 한 현대문학의 대표작입니다."
  }
]`;
                }

                function populateExample() {
                    editorValue.value = getDefaultJson();
                    setStatus("예시 데이터로 채웠습니다.");
                }

                function resetNewItemForm() {
                    newItem.id = "";
                    newItem.country = "";
                    newItem.city = "";
                    newItem.lat = "";
                    newItem.lng = "";
                    newItem.title = "";
                    newItem.author = "";
                    newItem.desc = "";
                }

                function findFirstObjectRange(jsonText) {
                    const start = jsonText.indexOf("{");
                    if (start === -1) return null;

                    let depth = 0;
                    for (let i = start; i < jsonText.length; i += 1) {
                        const ch = jsonText[i];
                        if (ch === "{") depth += 1;
                        if (ch === "}") {
                            depth -= 1;
                            if (depth === 0) {
                                return { start, end: i + 1 };
                            }
                        }
                    }
                    return null;
                }

                async function verifyItemAddedOnServer(expectedItem) {
                    const maxAttempts = 4;
                    const delayMs = 700;

                    for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                        try {
                            const response = await fetch("./data.json", { cache: "no-store" });
                            if (!response.ok) {
                                throw new Error("HTTP " + response.status);
                            }

                            const serverData = await response.json();
                            if (!Array.isArray(serverData)) {
                                throw new Error("서버 data.json 최상위가 배열이 아닙니다.");
                            }

                            const found = serverData.some((entry) =>
                                String(entry?.id || "") === expectedItem.id &&
                                String(entry?.title || "") === expectedItem.title &&
                                String(entry?.city || "") === expectedItem.city
                            );

                            if (found) {
                                return { ok: true, attempts: attempt };
                            }
                        } catch (error) {
                            if (attempt === maxAttempts) {
                                return { ok: false, error: error.message };
                            }
                        }

                        await new Promise((resolve) => setTimeout(resolve, delayMs));
                    }

                    return { ok: false };
                }

                async function prependItemToJson() {
                    const requiredFields = ["country", "city", "lat", "lng", "title", "author", "desc"];
                    const missingField = requiredFields.find((key) => !String(newItem[key] || "").trim());
                    if (missingField) {
                        setStatus("필수 필드가 비어 있습니다: " + missingField, "error");
                        return;
                    }

                    const latNum = Number(newItem.lat);
                    const lngNum = Number(newItem.lng);
                    if (!Number.isFinite(latNum) || !Number.isFinite(lngNum)) {
                        setStatus("lat/lng는 숫자여야 합니다.", "error");
                        return;
                    }

                    const parsed = validateJson();
                    if (!parsed) return;

                    const generatedIdBase = (newItem.city + "-" + newItem.title)
                        .trim()
                        .replace(/\s+/g, "-");

                    const item = {
                        id: (newItem.id || generatedIdBase || ("item-" + Date.now())).trim(),
                        country: newItem.country.trim(),
                        city: newItem.city.trim(),
                        lat: latNum,
                        lng: lngNum,
                        title: newItem.title.trim(),
                        author: newItem.author.trim(),
                        desc: newItem.desc.trim()
                    };

                    parsed.unshift(item);
                    editorValue.value = JSON.stringify(parsed, null, 2);
                    setStatus("새 항목을 JSON 맨 위에 추가했습니다. 서버 반영 중입니다...");
                    activeTab.value = "json";
                    resetNewItemForm();

                    const updated = await applyChangesToServer(parsed, {
                        successMessage: "새 항목을 서버 data.json 맨 위에 추가했습니다."
                    });

                    if (updated) {
                        const verification = await verifyItemAddedOnServer(item);
                        if (verification.ok) {
                            setStatus("업데이트 완료: data.json에 새 항목이 정상 추가되었습니다.");
                        } else if (verification.error) {
                            setStatus("서버 반영은 되었지만 검증 중 오류가 발생했습니다: " + verification.error, "error");
                        } else {
                            setStatus("서버 반영은 되었지만 data.json에서 새 항목을 확인하지 못했습니다.", "error");
                        }
                    }

                    await nextTick();
                    const editorEl = jsonEditorRef.value;
                    if (!editorEl) return;

                    const range = findFirstObjectRange(editorValue.value);
                    editorEl.focus();
                    editorEl.scrollTop = 0;
                    if (range) {
                        editorEl.setSelectionRange(range.start, range.end);
                    }

                    isJsonFlash.value = false;
                    requestAnimationFrame(() => {
                        isJsonFlash.value = true;
                        setTimeout(() => {
                            isJsonFlash.value = false;
                        }, 1200);
                    });
                }

                function validateJson() {
                    try {
                        const parsed = JSON.parse(editorValue.value);
                        if (!Array.isArray(parsed)) {
                            throw new Error("최상위는 배열이어야 합니다.");
                        }
                        setStatus("JSON 검증 완료: " + parsed.length + "개 작품 데이터입니다.");
                        return parsed;
                    } catch (error) {
                        setStatus("JSON 검증 실패: " + error.message, "error");
                        return null;
                    }
                }

                async function applyChangesToServer(preparedData, options = {}) {
                    const { successMessage } = options;
                    const parsed = Array.isArray(preparedData) ? preparedData : validateJson();
                    if (!parsed) return false;

                    if (isSubmitting.value) {
                        return false;
                    }

                    isSubmitting.value = true;
                    setStatus("서버 반영 요청 중입니다...");

                    try {
                        const headers = {
                            "Content-Type": "application/json"
                        };

                        if (editorApiKey.value) {
                            headers["x-editor-key"] = editorApiKey.value;
                        }

                        const response = await fetch("/api/update-data", {
                            method: "POST",
                            headers,
                            body: JSON.stringify({
                                data: parsed,
                                commitMessage: commitMessage.value || undefined
                            })
                        });

                        const result = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            const detailParts = [];
                            if (result.error) detailParts.push(result.error);
                            if (result.statusCode) detailParts.push("status=" + result.statusCode);
                            if (result.details) detailParts.push("details=" + result.details);
                            if (result.hint) detailParts.push("hint=" + result.hint);
                            if (!detailParts.length) detailParts.push("HTTP " + response.status);
                            throw new Error(detailParts.join(" | "));
                        }

                        const commitSha = (result.commitSha || "").slice(0, 7);
                        const baseMessage = successMessage || "서버 data.json 반영 완료";
                        if (commitSha) {
                            setStatus(baseMessage + " (commit: " + commitSha + ")");
                        } else {
                            setStatus(baseMessage);
                        }
                        return true;
                    } catch (error) {
                        setStatus("서버 반영 실패: " + error.message, "error");
                        return false;
                    } finally {
                        isSubmitting.value = false;
                    }
                }

                async function loadCurrentJson() {
                    try {
                        const response = await fetch("./data.json", { cache: "no-store" });
                        if (!response.ok) throw new Error("HTTP " + response.status);
                        const text = await response.text();
                        editorValue.value = text;
                        setStatus("현재 data.json 내용을 불러왔습니다.");
                    } catch (error) {
                        setStatus("현재 data.json을 불러오지 못했습니다: " + error.message, "error");
                    }
                }

                onMounted(() => {
                    populateExample();
                });

                return {
                    editorValue,
                    statusMessage,
                    statusType,
                    editorApiKey,
                    commitMessage,
                    isSubmitting,
                    activeTab,
                    jsonEditorRef,
                    isJsonFlash,
                    newItem,
                    populateExample,
                    loadCurrentJson,
                    prependItemToJson,
                    resetNewItemForm,
                    validateJson,
                    applyChangesToServer
                };
            }
        }).mount("#app");
    </script>
</body>
</html>
